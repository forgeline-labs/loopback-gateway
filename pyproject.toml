[project]
name = "loopback-gateway"
version = "0.1.0"
description = "Loopback HTTP gateway with a static bearer token and fixed-window rate limiting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Forgeline Labs" }]
keywords = ["gateway", "rate-limiting", "loopback", "http"]
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
