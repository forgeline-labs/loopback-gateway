name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned development tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m ruff check --stdin-filename serve - < serve
          python -m ruff format --check --stdin-filename serve - < serve
          python -m py_compile serve

      - name: Public test suite
        run: python -m unittest discover -s tests -v
